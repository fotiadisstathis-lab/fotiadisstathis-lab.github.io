<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TradeQuest Bildmarke: ein „Q“ aus einem Ring, dessen Schweif eine aufrechte, steigende Kerze ist.
       Eigenentwurf, frei verwendbar für Fotiadis Apps. Farben: Nachtblau #0B1E33, Grün #22C55E, Mint #5EEAD4 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143457"/>
      <stop offset="1" stop-color="#0A1B2E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g transform="translate(-14 -30)">
    <!-- Ring, unten rechts offen -->
    <path d="M 640 720 A 245 245 0 1 1 740 556" fill="none" stroke="url(#ring)" stroke-width="96" stroke-linecap="round"/>
    <!-- Kerze als Schweif: Docht und Körper, aufrecht -->
    <rect x="745" y="600" width="34" height="330" rx="17" fill="#22C55E"/>
    <rect x="700" y="672" width="124" height="196" rx="30" fill="#22C55E"/>
  </g>
</svg>
